name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: player-hitbox
          path: build/libs/*.jar
      - name: Publish jar to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/*.jar \
            --title "Player Hitbox build ${{ github.run_number }}" \
            --notes "Fabric 1.21.11. Download the .jar below and put it in your mods folder (with Fabric API 0.141.6+)."
